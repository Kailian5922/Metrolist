name: Android Debug CI (ubuntu-latest)

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'

concurrency:
  group: android-debug-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Test, Ktlint & Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare CI Gradle
        uses: ./.github/actions/prepare-ci-gradle
        with:
          cache-scope: android-login-fix-debug
          persist-configuration-cache: 'false'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Run Android unit tests
        run: ./gradlew :shared:testAndroidHostTest :androidApp:testDebugUnitTest --no-daemon --console=plain

      - name: Run ktlintCheck
        run: ./gradlew :shared:ktlintCheck :androidApp:ktlintCheck --no-daemon --console=plain

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: metrolist-v14.0.0-login-fix-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
